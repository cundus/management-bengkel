<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17231D" />
    <title>Offline · WMC 225</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 0%, #2b3a30, #17231d 55%);
        color: #f4f1ea;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 400px; text-align: center; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 22px;
        display: grid; place-items: center; background: #f05a28;
        font-size: 30px; font-weight: 900; color: #fff;
        box-shadow: 0 20px 50px -20px rgba(240, 90, 40, .8);
      }
      h1 { font-size: 30px; line-height: 1.1; letter-spacing: -1px; margin: 0 0 12px; }
      p { color: #9eaea4; line-height: 1.7; font-size: 14px; margin: 0 0 24px; }
      button {
        border: 0; border-radius: 12px; padding: 13px 22px;
        background: #f05a28; color: #fff; font: inherit; font-weight: 800; cursor: pointer;
      }
      small { display: block; margin-top: 28px; color: #5f7468; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>Koneksi terputus.</h1>
      <p>
        Halaman ini belum bisa dimuat tanpa internet. Data bengkel tetap aman di server.
        Sambungkan kembali perangkat, lalu coba lagi.
      </p>
      <button type="button" onclick="location.reload()">Coba sambungkan ulang</button>
      <small>WMC 225 · Manajemen Bengkel</small>
    </main>
  </body>
</html>
